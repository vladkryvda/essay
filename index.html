<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Essay Crucible</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #fbfbfa;
      color: #1a1918;
      font-family: 'Newsreader', serif;
    }
    .font-sans-clean {
      font-family: 'Inter', sans-serif;
    }
    /* Плавний перехід кольору для Twitter-індикатора */
    .progress-ring-circle {
      transition: stroke-dashoffset 0.15s ease, stroke 0.2s ease;
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
    }
    textarea:focus {
      outline: none;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-[#e8e6df]">

  <!-- TOP BAR: Мінімалістичні налаштування та таймер -->
  <header class="max-w-3xl w-full mx-auto px-6 py-8 flex justify-between items-center font-sans-clean text-xs text-[#8c887e]">
    
    <!-- Часовий ліміт -->
    <div class="flex items-center space-x-3">
      <span class="tracking-wide uppercase text-[10px]">Час:</span>
      <select id="time-select" onchange="resetTimer()" class="bg-transparent border-b border-[#dedbd2] pb-0.5 text-[#1a1918] focus:outline-none cursor-pointer">
        <option value="25">25 хв</option>
        <option value="40" selected>40 хв</option>
        <option value="60">60 хв</option>
      </select>
      <span id="timer-display" class="font-medium text-[#1a1918] pl-2 text-sm">40:00</span>
    </div>

    <!-- Твіттер-подібний лічильник ліміту -->
    <div class="flex items-center space-x-3">
      <span id="limit-label" class="text-[11px] text-[#8c887e]">0 / 500 слів</span>
      
      <!-- SVG Круговий індикатор (як у Twitter) -->
      <div class="relative w-6 h-6 flex items-center justify-center">
        <svg class="w-6 h-6" viewBox="0 0 36 36">
          <!-- Фонове коло -->
          <circle cx="18" cy="18" r="14" fill="none" stroke="#e8e6df" stroke-width="3" />
          <!-- Прогрес-коло -->
          <circle id="progress-circle" class="progress-ring-circle" 
                  cx="18" cy="18" r="14" fill="none" 
                  stroke="#8c887e" stroke-width="3" 
                  stroke-dasharray="87.96" stroke-dashoffset="87.96" />
        </svg>
      </div>

      <!-- Вибір ліміту слів -->
      <select id="word-target" onchange="updateProgress()" class="bg-transparent text-[#8c887e] border-none text-[10px] focus:outline-none cursor-pointer">
        <option value="300">300</option>
        <option value="500" selected>500</option>
        <option value="750">750</option>
        <option value="1000">1000</option>
      </select>
    </div>
  </header>

  <!-- ЦЕНТРАЛЬНИЙ РЕДАКТОР (Тільки думка і текст) -->
  <main class="flex-1 max-w-2xl w-full mx-auto px-6 py-4 flex flex-col">
    <input type="text" id="essay-title" placeholder="Тема або питання есе..." 
           class="w-full bg-transparent text-xl md:text-2xl text-[#1a1918] placeholder-[#b8b5ab] mb-6 focus:outline-none font-medium">

    <textarea id="editor" 
              placeholder="Починайте писати аргумент одразу. Без відволікань..." 
              class="w-full flex-1 bg-transparent text-lg md:text-xl leading-relaxed text-[#2b2927] placeholder-[#ccc8be] resize-none"></textarea>
  </main>

  <!-- НИЖНЯ ПАНЕЛЬ: Статус -->
  <footer class="max-w-3xl w-full mx-auto px-6 py-6 flex justify-between items-center font-sans-clean text-[11px] text-[#aba79d]">
    <span id="status-text">Готовий до письма</span>
    <button onclick="copyText()" class="hover:text-[#1a1918] transition-colors">Скопіювати есе</button>
  </footer>

  <script>
    const editor = document.getElementById('editor');
    const circle = document.getElementById('progress-circle');
    const limitLabel = document.getElementById('limit-label');
    const timerDisplay = document.getElementById('timer-display');
    const timeSelect = document.getElementById('time-select');
    const targetSelect = document.getElementById('word-target');
    const statusText = document.getElementById('status-text');

    const circumference = 2 * Math.PI * 14; // ~87.96
    circle.style.strokeDasharray = `${circumference}`;

    let timeLeft = parseInt(timeSelect.value) * 60;
    let timerRunning = false;
    let timerInterval = null;

    // --- Оновлення прогресу слів (Twitter Style) ---
    function updateProgress() {
      const text = editor.value.trim();
      const words = text ? text.split(/\s+/).length : 0;
      const target = parseInt(targetSelect.value);

      // Запуск таймера при першому символі
      if (!timerRunning && words > 0) {
        startTimer();
      }

      const fraction = words / target;
      const offset = circumference - Math.min(fraction, 1) * circumference;
      circle.style.strokeDashoffset = offset;

      // Зміна кольорів відповідно до заповнення
      if (words < target * 0.8) {
        // До 80% — спокійний сірий
        circle.setAttribute('stroke', '#8c887e');
        limitLabel.classList.remove('text-amber-600', 'text-red-600');
        limitLabel.classList.add('text-[#8c887e]');
        limitLabel.innerText = `${words} / ${target} слів`;
      } else if (words <= target) {
        // Від 80% до 100% — попереджувальний бурштиновий
        circle.setAttribute('stroke', '#d97706');
        limitLabel.classList.remove('text-[#8c887e]', 'text-red-600');
        limitLabel.classList.add('text-amber-600');
        limitLabel.innerText = `${words} / ${target} слів`;
      } else {
        // Перевищення — червоний, показує скільки перебрали
        circle.setAttribute('stroke', '#dc2626');
        limitLabel.classList.remove('text-[#8c887e]', 'text-amber-600');
        limitLabel.classList.add('text-red-600');
        limitLabel.innerText = `+${words - target} понад ліміт`;
      }
    }

    editor.addEventListener('input', updateProgress);

    // --- Таймер ---
    function startTimer() {
      timerRunning = true;
      statusText.innerText = "Йде запис...";
      timerInterval = setInterval(() => {
        timeLeft--;
        const mins = Math.floor(timeLeft / 60);
        const secs = timeLeft % 60;
        timerDisplay.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          statusText.innerText = "Час вичерпано!";
          timerDisplay.classList.add('text-red-600');
        }
      }, 1000);
    }

    function resetTimer() {
      clearInterval(timerInterval);
      timerRunning = false;
      timeLeft = parseInt(timeSelect.value) * 60;
      const mins = Math.floor(timeLeft / 60);
      timerDisplay.innerText = `${mins.toString().padStart(2, '0')}:00`;
      timerDisplay.classList.remove('text-red-600');
      statusText.innerText = "Готовий до письма";
    }

    // --- Копіювання ---
    function copyText() {
      const fullText = `${document.getElementById('essay-title').value}\n\n${editor.value}`;
      navigator.clipboard.writeText(fullText).then(() => {
        statusText.innerText = "Скопійовано в буфер обміну";
        setTimeout(() => statusText.innerText = timerRunning ? "Йде запис..." : "Готовий", 2000);
      });
    }
  </script>
</body>
</html>
